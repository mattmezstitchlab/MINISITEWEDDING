<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` : la scène passe sous l'encoche et la barre du bas,
         et les marges sûres (`env(safe-area-inset-*)`) reprennent le dessus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- L'application : ajoutée à l'écran d'accueil, elle s'ouvre sur AIME MAGAZINE,
         sans barre de navigateur. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AIME" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Super Mariage — L'espace de votre union. Le mini-site de votre mariage, composé et personnalisé selon vos envies."
    />
    <title>Super Mariage — L'espace de votre union.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
